global:
  minikube: false
  operator: true
  exposeALLDS: false

labels: 
  app: ska-tmc-integration

# DISH LMC
ska-mid-dish-manager:
  labels:
    app: ska-tmc-integration
  enabled: true


ska-mid-dish-simulators:
  image:
    registry: artefact.skao.int
    image: ska-mid-dish-simulators
    tag: 3.1.1
    pullPolicy: IfNotPresent
  labels:
    app: ska-tmc-integration
  enabled: true
  deviceServers:
    spfdevice:
      enabled: true
    spfrxdevice:
      enabled: true
  dsOpcuaSimulator:
    enabled: true

ska-mid-dish-ds-manager:
  labels:
    app: ska-tmc-integration
  enabled: true
