display: ":0"
xauthority: "~/.Xauthority"

legacy_compatibility: true

global:
  retry: 
  - "--sleep=1"
  - "--tries=100"
  sub-system:
    ska-tango-util:
      enabled: false
    ska-tango-base:
      enabled: false
    ska-tango-taranta:
      enabled: false
  tango_host: databaseds-tango-base-test:10000
  dsconfig:
    timeout: 300s
    image:
      registry: artefact.skao.int
      image: ska-tango-images-tango-dsconfig
      tag: 1.5.7
      pullPolicy: IfNotPresent
  itango:
    image:
      registry: artefact.skao.int
      image: ska-tango-images-tango-itango
      tag: 9.3.10
      pullPolicy: IfNotPresent
  sdp:
    processingNamespace: ska-tmc-integration-sdp

ska-tango-base:
  enabled: true
  vnc:
    replicas: 1
    enabled: false
  tangorest:
    enabled: false
    replicas: 1
  tangodb:
    use_pv: false

ska-taranta:
  enabled: false
  ingress:
    enabled: true
    nginx: true
    hostname: k8s.stfc.skao.int
  tangogql:
    replicas: 1
    resources:
      requests:
        cpu: 100m # 100m = 0.1 CPU
        memory: 100Mi # 100Mi = 0.1 GB mem
      limits:
        cpu: 200m # 200m = 0.2CPU
        memory: 200Mi # 200Mi = 0.2 GB mem

# Tmc-Mid
tmc-mid:
  labels:
    app: ska-tmc-integration
  enabled: true

  deviceServers:
    mocks:
      enabled: true
      dish: true
      csp: true
      sdp: true
    
    cspsubarrayleafnode:
      TelmodelSource: gitlab://gitlab.com/ska-telescope/ska-telmodel-data?main#tmdata
      TelmodelPath: instrument/ska1_mid/layout/mid-layout.json
      DelayCadence: 10
      DelayValidityPeriod: 20
      DelayModelTimeInAdvance: 30
  
    dishleafnode:
      IsDishAbortCommandsEnabled: "True"
      resources:
        limits:
          memory: 3000Mi
        requests:
          cpu: 2000m
          memory: 280Mi
      CommandTimeOut: 90
      SleepTime: 1

    dishpointingdevice:
      TrackTableUpdateRate: 10
      TrackTableInAdvance: 7
      ElevationMaxLimit: 90.0
      ElevationMinLimit: 15.0
      AzimuthMaxLimit: 270
      AzimuthMinLimit: -270

ska-sdp:
  resources:
    limits:
      memory: 200Mi
      cpu: 0.1
    requests:
      memory: 100Mi
      cpu: 0.2
  enabled: false
  lmc:
    resources:
      limits:
        memory: 500Mi
        cpu: 0.5
      requests:
        memory: 100Mi
        cpu: 0.3
    prefix: mid
    nsubarray: 1
  data-pvc:
    create:
      enabled: true
      size: 100Mi
      storageClassName: nfss1
  ska-tango-base:
    enabled: false

# SKUID
ska-ser-skuid:
  labels:
    app: ska-tmc-integration
  enabled: true
  skuid:
    use_pv: false
    config:
      generator_id: mvp01
  
ska-tango-alarmhandler:
  labels: 
    app: ska-tmc-integration
  enabled: true
  legacy_compatibility: true

ska-tmc-simulators:
  labels: 
    app: ska-tmc-integration
  enabled: true
  deviceServers:
    cspmastersimulator:
      enabled: false
    
    weatherstation:
      enabled: false
    
    powersupplysimulator:
      enabled: false

ska-csp-lmc-mid:
  labels: 
    app: ska-tmc-integration
  enabled: false

ska-mid-cbf-mcs:
  labels: 
    app: ska-tmc-integration

ska-mid-cbf-tmleafnode:
  labels: 
    app: ska-tmc-integration