name: "sdpmasterleafnode-test"
function: telescope-monitoring
domain: general-monitoring
instances: ["01"]
{{- $domain := .Values.global.domain}}
{{- $family := .Values.deviceServers.sdpmasterleafnode.family }}
{{- $member := .Values.deviceServers.sdpmasterleafnode.member }}
entrypoints:
  - name: "ska_tmc_sdpmasterleafnode.sdp_master_leaf_node_mid.MidTmcLeafNodeSdp"
server:
  name: "sdp_master_leaf_node"
  instances:
  - name: "01"
    classes:
    - name: "MidTmcLeafNodeSdp"
      devices:
      - name: "{{ $domain }}/{{ $family }}/{{ $member }}"
        properties:
        - name: "SdpMasterFQDN"
          values:
          - "{{.Values.global.sdp_master}}"
        - name: "SkaLevel"
          values:
            - "3"
        - name: "LoggingTargetsDefault"
          values:
            - "tango::logger"
        - name: "LoggingLevelDefault"
          values:
            - "{{coalesce $.Values.deviceServers.sdpmasterleafnode.LoggingLevel $.Values.global.TMCLoggingLevel }}"
        - name: "AdapterTimeOut"
          values: 
            - "{{ .Values.deviceServers.sdpmasterleafnode.AdapterTimeOut }}"
        - name: "LivelinessCheckPeriod"
          values: 
            - "{{ .Values.deviceServers.sdpmasterleafnode.LivelinessCheckPeriod }}"
        - name: "EventSubscriptionCheckPeriod"
          values: 
            - "{{ .Values.deviceServers.sdpmasterleafnode.EventSubscriptionCheckPeriod }}"
        - name: "SDPMasterAdminModeEnabled"
          values:
            - "{{.Values.deviceServers.sdpmasterleafnode.SDPMasterAdminModeEnabled}}"

depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.sdpleafnodes.image.registry}}"
  image: "{{.Values.sdpleafnodes.image.image}}"
  tag: "{{.Values.sdpleafnodes.image.tag}}"
  pullPolicy: "{{.Values.sdpleafnodes.image.pullPolicy}}"

