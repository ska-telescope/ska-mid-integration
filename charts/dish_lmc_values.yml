global:
  minikube: false
  operator: true
  exposeALLDS: false

labels:
  app: ska-tmc-integration

# DISH LMC
ska-dish-lmc:
  ska-tango-base:
    enabled: false
  ska-mid-dish-manager:
    enabled: true
    # TEMP COMMIT: Remove once b4capabilitystate discussions complete
    dishmanager:
      image:
        registry: registry.gitlab.com/ska-telescope/ska-mid-dish-manager
        image: ska-mid-dish-manager
        tag: 6.0.1-dev.c44bcc928
  ska-mid-dish-ds-manager:
    enabled: true
  ska-mid-dish-simulators:
    enabled: true
    deviceServers:
      spfdevice:
        enabled: true
      spfrxdevice:
        enabled: true
    dsOpcuaSimulator:
      enabled: true
