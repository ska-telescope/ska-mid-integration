display: ":0"
xauthority: "~/.Xauthority"

legacy_compatibility: true

global:
  retry: 
  - "--sleep=1"
  - "--tries=100"
  sub-system:
    ska-tango-util:
      enabled: false
    ska-tango-base:
      enabled: false
    ska-tango-taranta:
      enabled: false
  tango_host: databaseds-tango-base-test:10000
  dsconfig:
    timeout: 300s
    image:
      registry: artefact.skao.int
      image: ska-tango-images-tango-dsconfig
      tag: 1.5.7
      pullPolicy: IfNotPresent
  itango:
    image:
      registry: artefact.skao.int
      image: ska-tango-images-tango-itango
      tag: 9.3.10
      pullPolicy: IfNotPresent
  sdp:
    processingNamespace: ska-tmc-integration-sdp

ska-tango-base:
  enabled: true
  vnc:
    replicas: 1
    enabled: false
  tangorest:
    enabled: false
    replicas: 1
  tangodb:
    use_pv: false

ska-taranta:
  enabled: false
  ingress:
    enabled: true
    nginx: true
    hostname: k8s.stfc.skao.int
  tangogql:
    replicas: 1
    resources:
      requests:
        cpu: 100m # 100m = 0.1 CPU
        memory: 100Mi # 100Mi = 0.1 GB mem
      limits:
        cpu: 200m # 200m = 0.2CPU
        memory: 200Mi # 200Mi = 0.2 GB mem

# Tmc-Mid
tmc-mid:
  resources:
    requests:
      cpu: 200m # 0.5 CPU
      memory: 500Mi # 1 GB mem
    limits:
      cpu: 500m # 1 CPU
      memory: 1024Mi # 2 GB mem
  labels:
    app: ska-tmc-integration
  enabled: true
  
  cspsubarrayleafnode:
    DelayCadence: 10
    DelayValidityPeriod: 20
    DelayModelTimeInAdvance: 30
  deviceServers:
    mocks:
      enabled: true
      dish: true
      csp: true
      sdp: true

ska-sdp:
  resources:
    limits:
      memory: 200Mi
      cpu: 0.1
    requests:
      memory: 100Mi
      cpu: 0.2
  legacy_compatibility: true
  enabled: false
  lmc:
    prefix: mid
    nsubarray: 2
  console:
    enabled: true
  data-pvc:
    create:
      enabled: true
      size: 100Mi
      storageClassName: nfss1
  ska-sdp-qa:
    enabled: true
    config:
      kafka:
        overrideUrl: "ska-sdp-kafka:9092"
  ska-tango-base:
    enabled: false
  kafka:
    enabled: true
    resources:
        limits:
          cpu: 200m
          memory: 100Mi
        requests:
          cpu: 100m
          memory: 50Mi

 
# SKUID
ska-ser-skuid:
  labels:
    app: ska-tmc-integration
  enabled: true
  skuid:
    use_pv: false
    config:
      generator_id: mvp01
  
ska-tango-alarmhandler:
  labels: 
    app: ska-tmc-integration
  enabled: true
  legacy_compatibility: true

ska-tmc-simulators:
  labels: 
    app: ska-tmc-integration
  enabled: true
  deviceServers:
    cspmastersimulator:
      enabled: false
    
    weatherstation:
      enabled: false
    
    powersupplysimulator:
      enabled: false

ska-csp-lmc-mid:
  labels: 
    app: ska-tmc-integration
  enabled: false

ska-mid-cbf-mcs:
  labels: 
    app: ska-tmc-integration

ska-mid-cbf-tmleafnode:
  labels: 
    app: ska-tmc-integration