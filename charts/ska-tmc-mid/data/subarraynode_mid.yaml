name: "subarraynode-test"
function: telescope-monitoring
domain: subarray
instances: ["01"]
entrypoints:
  - name: "ska_tmc_subarraynode.subarray_node_mid.MidTmcSubarray"
server:
  name: "subarray_node_mid"
  instances:
  {{- $csp_sa_ln_fqdn_prefix:= .Values.global.csp_subarray_ln_prefix}}
  {{- $sdp_sa_ln_fqdn_prefix:= .Values.global.sdp_subarray_ln_prefix}}
  {{- $csp_sa_fqdn_prefix:= .Values.global.csp_subarray_prefix}}
  {{- $sdp_sa_fqdn_prefix:= .Values.global.sdp_subarray_prefix}}
  {{- $isSimulatedDish := .Values.deviceServers.mocks.dish }}
  {{- $real_dish_name := .Values.global.namespace_dish.dish_names }}
  {{- $DishMasterIdentifier := .Values.global.dish_suffix }}
  {{- $dish_id := .Values.global.dishes }}
  {{- $mocks_enabled := .Values.deviceServers.mocks.enabled}}
  {{- $csp_assign_interface := .Values.deviceServers.subarraynode.CspAssignResourcesInterfaceURL }}
  {{- $csp_scan_interface := .Values.deviceServers.subarraynode.CspScanInterfaceURL }}
  {{- $sdp_scan_interface := .Values.deviceServers.subarraynode.SdpScanInterfaceURL }}
  {{- $CommandTimeOutDefault := .Values.deviceServers.subarraynode.CommandTimeOutDefault}}
  {{- $AbortCommandTimeOut := .Values.deviceServers.subarraynode.AbortCommandTimeOut}}
  {{- $LivelinessCheckPeriod := .Values.deviceServers.subarraynode.LivelinessCheckPeriod}}
  {{- $EventSubscriptionCheckPeriod := .Values.deviceServers.subarraynode.EventSubscriptionCheckPeriod}}
  {{- $DishLeafNodePrefix := .Values.global.dish_ln_prefix}}
  {{- $Domain := .Values.global.domain }}
  {{- $Family := .Values.deviceServers.subarraynode.family }}
  {{- range  ( regexSplit " " ((.Values.subarray_count | int) | seq ) -1 ) }}
    - name: "{{ printf "%02s" . }}"
      classes:
      - name: "MidTmcSubarray"
        devices:
        - name: "{{ $Domain }}/{{ $Family }}/{{ printf "%02s" . }}"
          properties:
          - name: "DishLeafNodePrefix"
            values:
            - "{{ $DishLeafNodePrefix }}"
          - name: "DishMasterIdentifier"
            values:
            - "{{ $DishMasterIdentifier }}"
          - name: "CspSubarrayLNFQDN"
            values:
            - "{{ $csp_sa_ln_fqdn_prefix}}{{ printf "%02s" . }}"
          - name: "SdpSubarrayLNFQDN"
            values:
            - "{{ $sdp_sa_ln_fqdn_prefix}}{{ printf "%02s" . }}"
          - name: "CspSubarrayFQDN"
            values:
            - "{{ $csp_sa_fqdn_prefix}}/{{ printf "%02s" . }}"
          - name: "SdpSubarrayFQDN"
            values:
            - "{{ $sdp_sa_fqdn_prefix}}/{{ printf "%02s" . }}"
          - name: "DishMasterFQDNs"
            values:
            {{- if and (eq $mocks_enabled true) (eq $isSimulatedDish true) }}
            {{- range  $dish_id }}
            - "{{ $DishMasterIdentifier }}/{{ . | lower }}"
            {{- end }}
            {{- else }}
            {{- range  $real_dish_name }}
            - "{{ . }}" # Real dish
            {{- end }}
            {{- end }}
          - name: "SkaLevel"
            values:
              - "2"
          - name: "LoggingTargetsDefault"
            values:
              - "tango::logger"
          - name: "LoggingLevelDefault"
            values:
              - "5"
          - name: "CommandTimeOutDefault"
            values:
              - "{{ $CommandTimeOutDefault }}"
          - name: "AbortCommandTimeOut"
            values:
              - "{{ $AbortCommandTimeOut}}"
          - name: "CspAssignResourcesInterfaceURL"
            values:
              - "{{ $csp_assign_interface }}"
          - name: "CspScanInterfaceURL"
            values:
              - "{{ $csp_scan_interface }}"
          - name: "SdpScanInterfaceURL"
            values:
              - "{{ $sdp_scan_interface }}"
          - name: "LivelinessCheckPeriod"
            values:
              - "{{ $LivelinessCheckPeriod }}"
          - name: "EventSubscriptionCheckPeriod"
            values:
              - "{{ $EventSubscriptionCheckPeriod }}"
  {{- end}}
depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.subarraynode.image.registry}}"
  image: "{{.Values.subarraynode.image.image}}"
  tag: "{{.Values.subarraynode.image.tag}}"
  pullPolicy: "{{.Values.subarraynode.image.pullPolicy}}"

resources:
  limits:
    memory: "{{.Values.deviceServers.subarraynode.resources.limits.memory}}"
  requests:
    cpu: "{{.Values.deviceServers.subarraynode.resources.requests.cpu}}"
    memory: "{{.Values.deviceServers.subarraynode.resources.requests.memory}}"