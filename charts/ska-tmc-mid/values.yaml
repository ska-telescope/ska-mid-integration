resources:
  limits:
    cpu: 600m
    memory: 2000Mi
  requests:
    cpu: 500m
    memory: 1000Mi


deviceServers:
  centralnode:
    enabled: true
    instances: ["01"]
    subarray_count: 1
    file: "data/centralnode_mid.yaml"
    DishLeafNodePrefix: "ska_mid/tm_leaf_node/d0"
    DishIDs: ["SKA001", "SKA036", "SKA063", "SKA100"]
    RealDishMasterIdentifier: "mid-dish/dish-manager"
    SimulatorDishMasterIdentifier: "elt/master"
    DishVccConfig:
      DishVccUri: "car://gitlab.com/ska-telescope/ska-telmodel-data?ska-sdp-tmlite-repository-1.0.0#tmdata"
      DishVccFilePath: "instrument/ska1_mid_psi/ska-mid-cbf-system-parameters.json"
      Enabled: "true"
      DishKvalueAggregationAllowedPercent: "100.0"
    KValueValidRange:
      min: 1
      max: 1177

  subarraynode:
    enabled: true
    file: "data/subarraynode_mid.yaml"
    DishLeafNodePrefix: "ska_mid/tm_leaf_node/d0"
    DishIDs: ["SKA001", "SKA036", "SKA063", "SKA100"]
    RealDishMasterIdentifier: "mid-dish/dish-manager"
    SimulatorDishMasterIdentifier: "elt/master"
    CspAssignResourcesInterfaceURL: "https://schema.skao.int/ska-csp-assignresources/2.0"
    CspScanInterfaceURL: "https://schema.skao.int/ska-csp-scan/2.0"
    SdpScanInterfaceURL: "https://schema.skao.int/ska-sdp-scan/0.4"

  sdpsubarrayleafnode:
    enabled: true
    file: "data/sdpsubarrayleafnode.yaml"

  sdpmasterleafnode:
    enabled: true
    instances: ["01"]
    file: "data/sdpmasterleafnode.yaml"

  cspmasterleafnode:
    enabled: true
    instances: ["01"]
    file: "data/cspmasterleafnode.yaml"

  cspsubarrayleafnode:
    enabled: true
    file: "data/cspsubarrayleafnode.yaml"
    DelayCadence: 10.0
    DelayValidityPeriod: 20.0
    DelayModelTimeInAdvance: 30

  dishleafnode:
    enabled: true
    file: "data/dishleafnode.yaml"
    resources:
      limits:
        memory: 2000Mi
      requests:
        cpu: 900m
        memory: 1000Mi

  mocks:
    enabled: false
    file: "data/mocks.yaml"
    dish: false
    csp: false
    sdp: false

nodeSelector: {}

affinity: {}

tolerations: []