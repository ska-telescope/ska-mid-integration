name: "mocks-{{.Release.Name}}"
function: testing
domain: mocks
instances:
  - "01"
  - "02"
  - "03"
  - "04"
  - "05"
{{- range .Values.global.dishes }}
  {{- $num := regexReplaceAll "^[A-Za-z]+" . "" }}
  - "{{ $num }}"
{{- end }}


{{- $midSdpControlFqdn := .Values.global.sdp_master }}
{{- $midSdpSubarrayFqdn1 := .Values.global.mid_sdp_subarray_1 }}
{{- $midSdpSubarrayFqdn2 := .Values.global.mid_sdp_subarray_2 }}
{{- $midSdpSubarrayFqdn3 := .Values.global.mid_sdp_subarray_3 }}
{{- $midSdpSubarrayFqdn4 := .Values.global.mid_sdp_subarray_4 }}
{{- $midSdpQueueConnector := .Values.global.mid_sdp_queueconnector }}
{{- $midCspControl := .Values.global.mid_csp_control }}
{{- $midCspSubarray1 := .Values.global.mid_csp_subarray_1 }}
{{- $midCspSubarray2 := .Values.global.mid_csp_subarray_2 }}
{{- $midCspSubarray3 := .Values.global.mid_csp_subarray_3 }}
{{- $midCspSubarray4 := .Values.global.mid_csp_subarray_4 }}
{{- $dishManagerSuffix := .Values.global.dish_manager_suffix }}
entrypoints:
  - name: "ska_tmc_common.test_helpers.helper_base_device.HelperBaseDevice"
  - name: "ska_tmc_common.test_helpers.helper_dish_device.HelperDishDevice"
  - name: "ska_tmc_common.test_helpers.helper_subarray_device.HelperSubArrayDevice"
  - name: "ska_tmc_common.test_helpers.helper_csp_master_device.HelperCspMasterDevice"
  - name: "ska_tmc_common.test_helpers.helper_sdp_subarray.HelperSdpSubarray"
  - name: "ska_tmc_common.test_helpers.helper_sdp_queue_connector_device.HelperSdpQueueConnector"
server:
  name: "mocks"
  instances:
      {{- $isSimulatedDish := .Values.deviceServers.mocks.dish }}
      {{- $isSimulatedCsp := .Values.deviceServers.mocks.csp }}
      {{- $isSimulatedSdp := .Values.deviceServers.mocks.sdp }}
      {{- if eq $isSimulatedSdp true }}
    - name: "01"
      classes:
        - name: "HelperBaseDevice"
          devices:
          - name: "{{ $midSdpControlFqdn }}"
    - name: "02"
      classes:
        - name: "HelperSdpSubarray"
          devices:
          - name: "{{ $midSdpSubarrayFqdn1 }}"
          - name: "{{ $midSdpSubarrayFqdn2 }}"
          - name: "{{ $midSdpSubarrayFqdn3 }}"
          - name: "{{ $midSdpSubarrayFqdn4 }}"
    - name: "03"
      classes:
        - name: "HelperSdpQueueConnector"
          devices:
          - name: "{{ $midSdpQueueConnector }}"
      {{- end }}

      {{- if eq $isSimulatedCsp true }}
    - name: "04"
      classes:
        - name: "HelperCspMasterDevice"
          devices:
          - name: "{{ $midCspControl }}"
    - name: "05"
      classes:
        - name: "HelperSubArrayDevice"
          devices:
          - name: "{{ $midCspSubarray1 }}"
          - name: "{{ $midCspSubarray2 }}"
          - name: "{{ $midCspSubarray3 }}"
          - name: "{{ $midCspSubarray4 }}"
      {{- end }}
      {{- if eq $isSimulatedDish true }}
{{- range .Values.global.dishes }}
  {{- $num := regexReplaceAll "^[A-Za-z]+" . "" }}
    - name: "{{ $num }}"
      classes:
        - name: "HelperDishDevice"
          devices:
            - name: "{{ $dishManagerSuffix }}{{ $num }}"
{{- end }}
      {{- end }}
depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.skatmccommon.image.registry}}"
  image: "{{.Values.skatmccommon.image.image}}"
  tag: "{{.Values.skatmccommon.image.tag}}"
  pullPolicy: "{{.Values.skatmccommon.image.pullPolicy}}"
