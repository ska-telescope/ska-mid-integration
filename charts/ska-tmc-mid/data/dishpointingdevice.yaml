name: "dishpointingdevice-test"
function: dish-pointing
domain: pattern-mapping
instances: ["001", "036", "063", "100"]
entrypoints:
  - name: "ska_dishln_pointing_device.dishln_pointing_device.DishPointingDevice"
{{- $TrackTableEntries := .Values.deviceServers.dishpointingdevice.TrackTableEntries }}
{{- $PointingCalculationPeriod := .Values.deviceServers.dishpointingdevice.PointingCalculationPeriod }}
{{- $TrackTableInAdvance := .Values.deviceServers.dishpointingdevice.TrackTableInAdvance }}
{{- $Elevation := .Values.deviceServers.dishpointingdevice.Elevation }}
{{- $Azimuth := .Values.deviceServers.dishpointingdevice.Azimuth }}
{{- $ElevationMaxLimit := .Values.deviceServers.dishpointingdevice.ElevationMaxLimit }}
{{- $ElevationMinLimit := .Values.deviceServers.dishpointingdevice.ElevationMinLimit }} 
{{- $instance_list := list -}}
{{- $mocks_enabled := .Values.deviceServers.mocks.enabled}}
{{- $isSimulatedDish := .Values.deviceServers.mocks.dish }}
{{- $real_dish_name := .Values.global.namespace_dish.dish_names }}
{{- if and (eq $mocks_enabled true) (eq $isSimulatedDish true)  }}
{{- range $instance := .Values.global.dishes }}
{{- $instance_list = append $instance_list ($instance) }}
{{- end }}
{{- else }}
{{- range $instance_real := $real_dish_name }}
{{- $match := (regexFind "SKA(\\d{3})" $instance_real) -}}
{{- $instance_list = append $instance_list (trimPrefix "SKA" $match) }}
{{- end }}
{{- end }}
{{- range $index, $number := $instance_list }}
server:
  name: "dishpointing"
  instances:
  {{- range  .Values.deviceServers.dishleafnode.instances }}
    - name: "{{ $number }}"
      classes:
      - name: "DishPointingDevice"
        devices:
        - name: "mid-tmc/dish-pointing/d0{{ $number }}"
          properties:
            - name: "TrackTableEntries"
              values:
                - "{{ $TrackTableEntries }}"
            - name: "PointingCalculationPeriod"
              values:
                - "{{ $PointingCalculationPeriod }}"
            - name: "TrackTableInAdvance"
              values:
                - "{{ $TrackTableInAdvance }}"
            - name: "Elevation"
              values:
                - "{{ $Elevation }}"
            - name: "Azimuth"
              values:
                - "{{ $Azimuth }}"
            - name: "ElevationMaxLimit"
              values:
                - "{{ $ElevationMaxLimit }}"
            - name: "ElevationMinLimit"
              values:
                - "{{ $ElevationMinLimit }}"
            - name: "LoggingTargetsDefault"
              values:
                - "tango::logger"
            - name: "LoggingLevelDefault"
              values:
                - "5"
            - name: "SkaLevel"
              values:
                - "3"
  {{- end }}

depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.dishleafnode.image.registry}}"
  image: "{{.Values.dishleafnode.image.image}}"
  tag: "{{.Values.dishleafnode.image.tag}}"
  pullPolicy: "{{.Values.dishleafnode.image.pullPolicy}}"