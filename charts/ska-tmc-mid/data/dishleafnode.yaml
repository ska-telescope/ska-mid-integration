name: "dishleafnode-test"
function: telescope-monitoring
domain: general-monitoring
instances:
{{- range .Values.global.dishids }}
  {{- $num := regexReplaceAll "^[A-Za-z]+" . "" }}
  - "{{ $num }}"
{{- end }}
entrypoints:
  - name: "ska_tmc_dishleafnode.dish_leaf_node.MidTmcLeafNodeDish"
server:
  name: "dish_leaf_node"
  instances:
  {{- $domain := .Values.global.domain }}
  {{- $family := .Values.deviceServers.dishleafnode.family }}
  {{- $prefixMember := .Values.deviceServers.dishleafnode.prefix_member }}
  {{- $dishManagerSuffix := .Values.global.dish_manager_suffix }}
  {{- $tmcDishPointingSuffix := .Values.global.dishln_pointing_suffix }}
  {{- $MaxTrackTableRetry := .Values.deviceServers.dishleafnode.MaxTrackTableRetry }}
  {{- $TrackTableRetryDuration := .Values.deviceServers.dishleafnode.TrackTableRetryDuration }}
  {{- $LivelinessCheckPeriod := .Values.deviceServers.dishleafnode.LivelinessCheckPeriod}}
  {{- $EventSubscriptionCheckPeriod := .Values.deviceServers.dishleafnode.EventSubscriptionCheckPeriod}}
  {{- $AdapterTimeOut := .Values.deviceServers.dishleafnode.AdapterTimeOut}}
  {{- $DishAvailabilityCheckTimeout := .Values.deviceServers.dishleafnode.DishAvailabilityCheckTimeout}}
  {{- $CommandTimeOutDefault := .Values.deviceServers.dishleafnode.CommandTimeOutDefault }}
  {{- $instance_list := list -}}
  {{- $mocks_enabled := .Values.deviceServers.mocks.enabled}}
  {{- $isSimulatedDish := .Values.deviceServers.mocks.dish }}
  {{- $isDishAbortEnabled := .Values.deviceServers.dishleafnode.IsDishAbortEnabled }}
  {{- $real_dish_name := .Values.global.namespace_dish.dish_names }}

  {{- if and (eq $mocks_enabled true) (eq $isSimulatedDish true) }}
    {{- range $instance := .Values.global.dishids }}
      {{- $num := regexReplaceAll "^[A-Za-z]+" $instance "" }}
      {{- $instance_list = append $instance_list $num }}
    {{- end }}
  {{- else }}
    {{- range $instance_real := $real_dish_name }}
  {{- $match := (regexFind "SKA(\\d{3})" $instance_real) -}}
  {{- $instance_list = append $instance_list (trimPrefix "SKA" $match) }}
  {{- end }}
  {{- end }}

  {{- range $index, $number := $instance_list }}
    - name: "{{ $number }}"
      classes:
      - name: "MidTmcLeafNodeDish"
        devices:
        - name: "{{ $domain }}/{{ $family }}/{{ $prefixMember }}{{ $number }}"
          properties:
            - name: "MidDishControl"
              values:
                {{- if and (eq $mocks_enabled true) (eq $isSimulatedDish true) }}
                - "{{ $dishManagerSuffix }}{{ $number }}" # Mock device FQDN
                {{- else }}
                  {{- range $index_real, $instance_real := $real_dish_name }}
                    {{- if eq $index_real $index }}
                - "{{ $instance_real }}"
                    {{- end }}
                  {{- end }}
                {{- end }}
            - name: "MidPointingDevice"
              values:
                - "{{ $tmcDishPointingSuffix }}{{ $number }}"
            - name: "SkaLevel"
              values:
                - "3"
            - name: "LoggingTargetsDefault"
              values:
                - "tango::logger"
            - name: "LoggingLevelDefault"
              values:
                - "5"
            - name: "CommandTimeOutDefault"
              values:
                - "{{ $CommandTimeOutDefault }}"
            - name: "IsDishAbortEnabled"
              values:
                - "{{ $isDishAbortEnabled }}"
            - name: "MaxTrackTableRetry"
              values:
                - "{{ $MaxTrackTableRetry }}"
            - name: "TrackTableRetryDuration"
              values:
                - "{{ $TrackTableRetryDuration }}"
            - name: "LivelinessCheckPeriod"
              values:
                - "{{ $LivelinessCheckPeriod }}"
            - name: "EventSubscriptionCheckPeriod"
              values:
                - "{{ $EventSubscriptionCheckPeriod }}"
            - name: "AdapterTimeOut"
              values:
                - "{{ $AdapterTimeOut }}"
            - name: "DishAvailabilityCheckTimeout"
              values:
                - "{{ $DishAvailabilityCheckTimeout }}"
  {{- end }}
depends_on:
  - device: sys/database/2
image:
  registry: "{{.Values.dishleafnode.image.registry}}"
  image: "{{.Values.dishleafnode.image.image}}"
  tag: "{{.Values.dishleafnode.image.tag}}"
  pullPolicy: "{{.Values.dishleafnode.image.pullPolicy}}"
resources:
  limits:
    memory: "{{.Values.deviceServers.dishleafnode.resources.limits.memory}}"
  requests:
    cpu: "{{.Values.deviceServers.dishleafnode.resources.requests.cpu}}"
    memory: "{{.Values.deviceServers.dishleafnode.resources.requests.memory}}"
