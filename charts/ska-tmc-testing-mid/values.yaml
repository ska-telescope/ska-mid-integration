display: ":0"
xauthority: "~/.Xauthority"

legacy_compatibility: true

global:
  retry: 
  - "--sleep=1"
  - "--tries=100"
  sub-system:
    ska-tango-util:
      enabled: false
    ska-tango-base:
      enabled: false
    ska-tango-taranta:
      enabled: false
  tango_host: databaseds-tango-base-test:10000
  dsconfig:
    timeout: 300s
    image:
      registry: artefact.skao.int
      image: ska-tango-images-tango-dsconfig
      tag: 1.5.7
      pullPolicy: IfNotPresent
  itango:
    image:
      registry: artefact.skao.int
      image: ska-tango-images-tango-itango
      tag: 9.3.10
      pullPolicy: IfNotPresent
  sdp:
    processingNamespace: ska-tmc-integration-sdp

ska-tango-base:
  enabled: true
  vnc:
    replicas: 1
    enabled: false
  tangorest:
    enabled: false
    replicas: 1
  tangodb:
    use_pv: false

ska-taranta:
  enabled: false
  ingress:
    enabled: true
    nginx: true
    hostname: k8s.stfc.skao.int
  tangogql:
    replicas: 1
    resources:
      requests:
        cpu: 100m # 100m = 0.1 CPU
        memory: 100Mi # 100Mi = 0.1 GB mem
      limits:
        cpu: 200m # 200m = 0.2CPU
        memory: 200Mi # 200Mi = 0.2 GB mem

# Tmc-Mid
tmc-mid:
  labels:
    app: ska-tmc-integration
  enabled: true

  deviceServers:
    centralnode:
      enabled: true
      instances: ["01"]
      subarray_count: 1
      file: "data/centralnode_mid.yaml"
      DishIDs: ["SKA001", "SKA036", "SKA063", "SKA100"]
      DishVccConfig:
        DishVccUri: "car://gitlab.com/ska-telescope/ska-telmodel-data?ska-sdp-tmlite-repository-1.0.0#tmdata"
        DishVccFilePath: "instrument/ska1_mid_psi/ska-mid-cbf-system-parameters.json"
        Enabled: "true"
        DishKvalueAggregationAllowedPercent: "100.0"
      KValueValidRange:
        min: 1
        max: 1177
      CommandTimeOut: 40
      DishVccInitTimeout: 180
      LivelinessCheckPeriod: 2.0
      EventSubscriptionCheckPeriod: 2.0
      family: "central-node"
      member : "0"

    subarraynode:
      enabled: true
      file: "data/subarraynode_mid.yaml"
      DishIDs: ["SKA001", "SKA036", "SKA063", "SKA100"]
      CspAssignResourcesInterfaceURL: "https://schema.skao.int/ska-csp-assignresources/2.0"
      CspScanInterfaceURL: "https://schema.skao.int/ska-csp-scan/2.0"
      SdpScanInterfaceURL: "https://schema.skao.int/ska-sdp-scan/0.4"
      CommandTimeOut: 30
      AbortCommandTimeOut: 50
      LivelinessCheckPeriod: 1.5
      EventSubscriptionCheckPeriod: 1.5
      family: "subarray"
      resources:
        limits:
          cpu: 600m
          memory: 1000Mi
        requests:
          cpu: 400m
          memory: 300Mi

    mocks:
      enabled: true
      dish: true
      csp: true
      sdp: true

ska-sdp:
  resources:
    limits:
      memory: 200Mi
      cpu: 0.1
    requests:
      memory: 100Mi
      cpu: 0.2
  enabled: false
  lmc:
    resources:
      limits:
        memory: 500Mi
        cpu: 0.5
      requests:
        memory: 100Mi
        cpu: 0.3
    prefix: mid
    nsubarray: 1
  data-pvc:
    create:
      enabled: true
      size: 100Mi
      storageClassName: nfss1
  ska-tango-base:
    enabled: false

# SKUID
ska-ser-skuid:
  labels:
    app: ska-tmc-integration
  enabled: true
  skuid:
    use_pv: false
    config:
      generator_id: mvp01
  
ska-tango-alarmhandler:
  labels: 
    app: ska-tmc-integration
  enabled: true
  legacy_compatibility: true

ska-tmc-simulators:
  labels: 
    app: ska-tmc-integration
  enabled: true
  deviceServers:
    cspmastersimulator:
      enabled: false
    
    weatherstation:
      enabled: false
    
    powersupplysimulator:
      enabled: false

ska-csp-lmc-mid:
  labels: 
    app: ska-tmc-integration
  enabled: false

ska-mid-cbf-mcs:
  labels: 
    app: ska-tmc-integration

ska-mid-cbf-tmleafnode:
  labels: 
    app: ska-tmc-integration

ska-mid-wms:
  legacy_compatibility: true
  dev-name: "mid/wms/0"
  ska-tango-base:
    enabled: false
    itango:
      enabled: false
  
